<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#0038a8"/>
    </linearGradient>
    <linearGradient id="mbiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#002b80"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0066ff" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="22" filter="url(#cardShadow)"/>
  
  <!-- Subtle Glass Highlight Arc -->
  <path d="M 38 280 C 140 230 320 200 474 150 L 474 384 C 474 445 425 474 384 474 L 128 474 C 78 474 38 434 38 384 Z" fill="#0066ff" fill-opacity="0.04"/>

  <g transform="translate(48, 140)">
    <!-- Letter M -->
    <path d="M 18 200 L 18 30 L 64 30 L 115 130 L 166 30 L 212 30 L 212 200 L 168 200 L 168 95 L 126 175 L 104 175 L 62 95 L 62 200 Z" fill="#0f172a"/>
    <!-- M inner Blue Accent Chevron -->
    <path d="M 62 145 L 115 220 L 168 145 L 140 145 L 115 182 L 90 145 Z" fill="url(#mbiGrad)"/>

    <!-- Letter B -->
    <path d="M 230 30 L 315 30 C 352 30 376 48 376 78 C 376 98 362 112 342 118 C 368 124 384 142 384 166 C 384 196 358 200 320 200 L 230 200 Z M 274 65 L 274 98 L 312 98 C 326 98 334 92 334 81 C 334 70 325 65 310 65 Z M 274 132 L 274 165 L 318 165 C 332 165 342 158 342 148 C 342 138 332 132 316 132 Z" fill="url(#mbiGrad)"/>

    <!-- Letter I -->
    <path d="M 400 30 L 442 30 L 442 200 L 400 200 Z" fill="#0f172a"/>
  </g>
</svg>
