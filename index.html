  <!-- Early console, fetch setter, and error filter for preview environments -->
  <script>
    (function () {
      // Ensure window.fetch is writable and cannot throw getter-only errors
      try {
        if (typeof window !== 'undefined') {
          var _nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window) || {}, 'fetch') ||
            Object.getOwnPropertyDescriptor(window.constructor ? window.constructor.prototype : {}, 'fetch');
          if (!desc || desc.configurable || (!desc.writable && !desc.set)) {
            try {
              Object.defineProperty(window, 'fetch', {
                get: function () { return _nativeFetch; },
                set: function (fn) { _nativeFetch = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (e) { }
          }
        }
      } catch (e) { }

      try {
        var isIgnored = function (msg) {
          if (!msg) return false;
          var str = (typeof msg === 'string' ? msg : (msg.message || msg.reason || (msg.error && msg.error.message) || String(msg))).toLowerCase();
          return (
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('vite:ws') !== -1 ||
            str.indexOf('sw.js') !== -1 ||
            str.indexOf('cannot set property fetch') !== -1 ||
            str.indexOf('which has only a getter') !== -1 ||
            str.indexOf('resizeobserver') !== -1
          );
        };

        ['error', 'warn', 'info', 'debug', 'log'].forEach(function (method) {
          if (console[method]) {
            var orig = console[method];
            console[method] = function () {
              var args = Array.prototype.slice.call(arguments);
              for (var i = 0; i < args.length; i++) {
                if (isIgnored(args[i])) return;
              }
              return orig.apply(console, args);
            };
          }
        });

        window.addEventListener('error', function (e) {
          if (isIgnored(e.message) || isIgnored(e.filename) || isIgnored(e.error)) {
            e.preventDefault();
            e.stopPropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          if (isIgnored(e.reason)) {
            e.preventDefault();
            e.stopPropagation();
            return true;
          }
        }, true);
      } catch (e) { }
    })();
  </script>
  <script>
    (function () {
      try {
        var landingTheme = localStorage.getItem('mbi_landing_theme');
        var raw = localStorage.getItem('mbi_system_app_settings_v2');
        var isDark = landingTheme === 'dark';
        if (!landingTheme && raw) {
          var settings = JSON.parse(raw);
          var theme = settings && settings.general && settings.general.theme;
          isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        }
        if (isDark || landingTheme === 'dark' || (!landingTheme && !raw)) {
          document.documentElement.classList.add('dark');
        } else if (landingTheme === 'light') {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>

  <!-- Failsafe emergency helper script & auto-recovery timer -->
  <script>
    (function () {
      // If running on localhost/127.0.0.1 in local development, unregister old production service workers immediately
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.port === '5173' || window.location.port === '3000') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        }
      }

      var timer = setTimeout(function () {
        var recoveryEl = document.getElementById('mbi-loader-recovery');
        var msgEl = document.getElementById('mbi-loader-msg');
        if (recoveryEl) recoveryEl.style.display = 'block';
        if (msgEl) msgEl.innerText = 'Syncing updates... Tap button if not loaded.';
      }, 4500);
      window.__mbi_timeout_timer = timer;

      window.__mbi_force_recover = function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              for (var i = 0; i < keys.length; i++) {
                caches.delete(keys[i]);
              }
            });
          }
        } catch (e) { }
        setTimeout(function () {
          window.location.reload();
        }, 150);
      };

      window.__mbi_emergency_reset = function () {
        if (confirm('Reset application local storage cache and reload? Your cloud data is safe.')) {
          try {
            localStorage.clear();
            sessionStorage.clear();
            if (window.indexedDB) {
              indexedDB.deleteDatabase('pharma-manager-db');
              indexedDB.deleteDatabase('MbiInventraOfflineDB');
            }
          } catch (e) {
            console.warn(e);
          }
          window.location.reload();
        }
      };
    })();
  </script>
